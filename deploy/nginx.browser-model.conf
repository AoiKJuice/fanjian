location = /tools/anime-affinity/model/browser-model-manifest.json {
    alias /opt/fanjian-model/anime-model-open-2026-27/browser-model-manifest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Accept-Ranges bytes always;
}

location ^~ /tools/anime-affinity/model/ {
    alias /opt/fanjian-model/anime-model-open-2026-27/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Accept-Ranges bytes always;
}
