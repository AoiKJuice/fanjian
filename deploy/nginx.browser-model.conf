location = /tools/anime-affinity/model/browser-model-manifest.json {
    access_log off;
    alias /opt/fanjian-model/current/browser-model-manifest.server.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Accept-Ranges bytes always;
}

location ^~ /tools/anime-affinity/model/releases/ {
    # Public downloads are handled by the Cloudflare release Worker.
    # Do not serve multi-gigabyte assets from the website origin.
    return 404;
}
