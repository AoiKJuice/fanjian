location = /tools/anime-affinity/model/browser-model-manifest.json {
    access_log off;
    alias /opt/fanjian-model/current/browser-model-manifest.server.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Accept-Ranges bytes always;
}

location ^~ /tools/anime-affinity/model/releases/model-2026-09-25/ {
    access_log off;
    alias /opt/fanjian-model/ranker-20260925/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Accept-Ranges bytes always;
}
